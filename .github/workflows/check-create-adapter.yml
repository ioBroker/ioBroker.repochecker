# Creates a new adapter using @iobroker/create-adapter with the maximum set of options
# (TypeScript, jsonConfig, extra tab (HTML), custom state options, ESLint, Prettier,
# code coverage, devcontainer, release-script, dev-server, dependabot) and runs the
# repochecker against the generated files using --offline mode (local files, no GitHub repository access).
# The findings are posted as comment to the pull request, added to the job summary and uploaded as artifact.

name: Check create-adapter template

on:
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # required to post the findings as comment to the pull request
  pull-requests: write
  issues: write

jobs:
  check-create-adapter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install Dependencies
        run: npm install

      - name: Create adapter using create-adapter
        run: |
          mkdir -p "$RUNNER_TEMP/adapter"
          npx --yes @iobroker/create-adapter@latest \
            --replay "$GITHUB_WORKSPACE/.github/create-adapter/maximum-options.json" \
            --target "$RUNNER_TEMP/adapter" \
            --nonInteractive \
            --skipAdapterExistenceCheck \
            --ignoreOutdatedVersion 2>&1 | tee "$RUNNER_TEMP/create-adapter.log"

      - name: Run repochecker
        working-directory: ${{ runner.temp }}/adapter/ioBroker.repocheckertest
        run: |
          # offline mode exits with code 1 if errors are found - findings are reported, not failing the job
          node "$GITHUB_WORKSPACE/index.js" https://github.com/ioBroker/ioBroker.repocheckertest --offline 2>&1 | tee "$RUNNER_TEMP/repochecker.log" || true

      - name: Report findings
        if: always()
        # posting the comment fails for PRs from forks (read-only token) - results are still available at the job summary
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const postComment = require('./scripts/postCreateAdapterComment.js');
            await postComment({ github, context, core });

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: create-adapter-check
          path: |
            ${{ runner.temp }}/create-adapter.log
            ${{ runner.temp }}/repochecker.log
